{% extends "base.html" %}
{% block title %}Manage My Order{% endblock %}
{% block content %}
<div class="wrap login-box">
  <img src="{{ url_for('static', filename='img/icon.svg') }}" alt="" width="56" height="56">
  <h1>Manage my order</h1>
  <p class="muted">View your order, or cancel it within 6 hours of placing it.</p>
  <form method="post">
    <label>Order number <input type="text" name="order_number" placeholder="VL-10001" required></label>
    <label>Email used for the order <input type="email" name="email" required></label>
    <button class="btn btn-block" type="submit">Find my order</button>
  </form>
</div>
{% endblock %}
