# Render Blueprint: creates the website and its PostgreSQL database from this repo.
services:
  - type: web
    name: veloure
    runtime: docker
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veloure-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: veloure-db
    plan: free
    databaseName: veloure
    user: veloure
